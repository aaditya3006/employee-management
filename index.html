    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Inter:wght@200;300;400;600;700&family=Italiana&family=Noto+Sans+Devanagari:wght@400;700&family=Poppins:wght@300;400;600&family=Sora:wght@400;500;600;700;800&display=swap');

      --light-green: #90ee90;

      padding: 0;

      overflow-x: hidden;
      position: relative;

    }

    body.show-marketing-landing #login-screen {
      display: none !important;
      visibility: hidden !important;
    }

    body.show-marketing-landing #sidebar,
    body.show-marketing-landing #sidebar-backdrop,
    body.show-marketing-landing #main-wrapper,
    body.show-marketing-landing #top-nav,
    body.show-marketing-landing #main-footer,
    body.show-marketing-landing #bg-image,
    body.show-marketing-landing #preview-section,
    body.show-marketing-landing #attendance-preview-section,
    body.show-marketing-landing #ta-preview-section {
      display: none !important;
    }

    #railsaathi-landing {
      position: relative;
      display: none;
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.16), transparent 20%),
        radial-gradient(circle at 85% 0%, rgba(29, 78, 216, 0.24), transparent 24%),
        linear-gradient(180deg, rgba(4, 10, 22, 0.98) 0%, rgba(7, 20, 43, 0.98) 52%, rgba(10, 30, 74, 0.98) 100%);
      isolation: isolate;
    }

    body.show-marketing-landing #railsaathi-landing {
      display: block;
    }

    #railsaathi-landing[hidden] {
      display: none !important;
    }

    .landing-scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000001;
      width: calc(var(--landing-progress, 0) * 1%);
      height: 4px;
      background: linear-gradient(90deg, #38bdf8 0%, #60a5fa 45%, #22c55e 100%);
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.6);
      transition: width 0.12s linear;
    }

    .landing-grid,
    .landing-ambient,
    .landing-orbit {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .landing-grid {
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.9), transparent 95%);
    }

    .landing-ambient::before,
    .landing-ambient::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(10px);
      opacity: 0.72;
    }

    .landing-ambient::before {
      top: 10vh;
      left: -10vw;
      width: 46vw;
      height: 46vw;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, transparent 72%);
      animation: landingFloat 12s ease-in-out infinite alternate;
    }

    .landing-ambient::after {
      right: -16vw;
      top: 24vh;
      width: 42vw;
      height: 42vw;
      background: radial-gradient(circle, rgba(29, 78, 216, 0.22) 0%, transparent 72%);
      animation: landingFloat 16s ease-in-out infinite alternate-reverse;
    }

    .landing-orbit::before,
    .landing-orbit::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.14);
    }

    .landing-orbit::before {
      width: 62vw;
      height: 62vw;
      right: -16vw;
      top: 14vh;
    }

    .landing-orbit::after {
      width: 34vw;
      height: 34vw;
      left: -8vw;
      bottom: 18vh;
    }

    .landing-trackline {
      position: absolute;
      inset: auto -16px 92px -16px;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(56, 189, 248, 0.65) 16%, rgba(255, 255, 255, 0.82) 50%, rgba(56, 189, 248, 0.65) 84%, transparent 100%);

      content: "";

      gap: 12px;
      margin-top: 18px;
    }

    .landing-pain-item,
    .landing-feature,
    .landing-stat,
    .landing-download-meta li,
    .landing-network-list li {
      list-style: none;
      padding: 14px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.52);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .landing-pain-item strong,
    .landing-feature strong {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #fff;
    }

    .landing-pain-item span,
    .landing-feature span,
    .landing-download-meta small,
    .landing-network-list small {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
    }

    .landing-workflow-layout {
      display: grid;
      gap: 18px;
    }

    .landing-workflow-rail {
      position: relative;
      padding: 18px;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(7, 20, 43, 0.78), rgba(15, 23, 42, 0.92));
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .landing-workflow-rail::before {
      content: "";
      position: absolute;
      left: 26px;
      top: 22px;
      bottom: 22px;
      width: 2px;
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.18), rgba(56, 189, 248, 0.76), rgba(34, 197, 94, 0.36));
    }

    .landing-step {
      position: relative;
      padding-left: 50px;
      min-height: 44px;
    }

    .landing-step+.landing-step {
      margin-top: 16px;
    }

    .landing-step__dot {
      position: absolute;
      left: 16px;
      top: 2px;
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: linear-gradient(135deg, #38bdf8, #1d4ed8);
      box-shadow: 0 0 0 6px rgba(56, 189, 248, 0.12);
    }

    .landing-step__title {
      display: block;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .landing-step__copy {
      display: block;
      margin-top: 5px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
    }

    .landing-phone-card {
      padding: 18px;
      overflow: hidden;
    }

    .landing-phone-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .landing-phone-tab {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: rgba(15, 23, 42, 0.44);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .landing-phone-tab.is-active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.24), rgba(29, 78, 216, 0.24));
      color: #fff;
    }

    .landing-phone-frame {
      margin-top: 18px;
      padding: 18px 16px;
      border-radius: 30px;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.94), rgba(15, 23, 42, 0.98));
      border: 1px solid rgba(148, 163, 184, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .landing-phone-notch {
      width: 88px;
      height: 16px;
      margin: 0 auto 18px;
      border-radius: 999px;
      background: rgba(51, 65, 85, 0.88);
    }

    .landing-phone-screen {
      display: none;
      padding: 16px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(10, 30, 74, 0.86), rgba(7, 20, 43, 0.96));
      min-height: 260px;
    }

    .landing-phone-screen.is-active {
      display: block;
    }

    .landing-phone-screen h4 {
      margin: 0;
      font-family: 'Sora', 'Inter', sans-serif;
      font-size: 18px;
    }

    .landing-phone-screen p {
      margin: 8px 0 0;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.6;
    }

    .landing-phone-list {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .landing-phone-list div {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      font-size: 12px;
    }

    .landing-feature-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .landing-feature {
      position: relative;
      overflow: hidden;
    }

    .landing-feature::after {
      content: "";
      position: absolute;
      inset: auto -18px -30px auto;
      width: 90px;
      height: 90px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.08);
    }

    .landing-stat-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .landing-stat strong {
      display: block;
      font-family: 'Sora', 'Inter', sans-serif;
      font-size: 24px;
      color: #f8fafc;
    }

    .landing-stat span {
      display: block;
      margin-top: 6px;
      color: #94a3b8;
      font-size: 12px;
    }

    .landing-network {
      margin-top: 22px;
      padding: 20px;
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(7, 20, 43, 0.76), rgba(15, 23, 42, 0.92));
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .landing-network-map {
      position: relative;
      min-height: 240px;
      margin-top: 18px;
      border-radius: 22px;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 24%, rgba(56, 189, 248, 0.12), transparent 24%),
        radial-gradient(circle at 84% 32%, rgba(29, 78, 216, 0.18), transparent 26%),
        linear-gradient(180deg, rgba(10, 30, 74, 0.92), rgba(7, 20, 43, 0.98));
    }

    .landing-network-map::before {
      content: "";
      position: absolute;
      inset: 18px;
      border-radius: 18px;
      border: 1px dashed rgba(148, 163, 184, 0.14);
    }

    .landing-route {
      position: absolute;
      inset: 40px 24px auto 24px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.14) 0%, rgba(56, 189, 248, 0.82) 48%, rgba(34, 197, 94, 0.84) 100%);
      transform: rotate(-8deg);
      transform-origin: left center;
    }

    .landing-route::after {
      content: "";
      position: absolute;
      top: -7px;
      left: 24%;
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: #f8fafc;
      box-shadow: 0 0 0 6px rgba(56, 189, 248, 0.16);
      animation: landingTrainMarker 5.4s ease-in-out infinite;
    }

    .landing-map-node {
      position: absolute;
      display: grid;
      gap: 5px;
      justify-items: center;
      color: #dbeafe;
      font-size: 11px;
    }

    .landing-map-node span:first-child {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: #38bdf8;
      box-shadow: 0 0 0 8px rgba(56, 189, 248, 0.12);
    }

    .landing-map-node small {
      color: #bfdbfe;
    }

    .landing-assistant {
      margin-top: 22px;
      display: grid;
      gap: 12px;
    }

    .landing-chat-bubble {
      width: fit-content;
      max-width: min(92%, 360px);
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      font-size: 12px;
      line-height: 1.6;
    }

    .landing-chat-bubble.is-user {
      margin-left: auto;
      background: linear-gradient(135deg, rgba(29, 78, 216, 0.28), rgba(56, 189, 248, 0.18));
    }

    .landing-download-grid {
      align-items: start;
    }

    .landing-download-card {
      overflow: hidden;
    }

    .landing-download-card__ribbon {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.16);
      color: #dcfce7;
      font-size: 11px;
      font-weight: 700;
    }

    .landing-download-meta {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      padding: 0;
    }

    .landing-download-meta li {
      padding: 14px 16px;
    }

    .landing-download-meta strong {
      display: block;
      margin-bottom: 6px;
      color: #fff;
      font-size: 12px;
    }

    .landing-install-steps {
      padding: 0;
    }

    .landing-install-steps li {
      list-style: none;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(148, 163, 184, 0.12);
      color: #e2e8f0;
      font-size: 12px;
    }

    .landing-install-steps b {
      width: 28px;
      height: 28px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(56, 189, 248, 0.14);
      color: #dbeafe;
    }

    .landing-faq {
      margin-top: 20px;
      padding: 10px;
    }

    .landing-faq details {
      border-radius: 18px;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }

    .landing-faq details+details {
      margin-top: 10px;
    }

    .landing-faq summary {
      cursor: pointer;
      list-style: none;
      font-size: 13px;
      font-weight: 700;
    }

    .landing-faq summary::-webkit-details-marker {
      display: none;
    }

    .landing-faq p {
      margin: 10px 0 0;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.7;
    }

    .landing-final__panel {
      position: relative;
      overflow: hidden;
    }

    .landing-final__panel::after {
      content: "";
      position: absolute;
      right: -22px;
      top: -30px;
      width: 160px;
      height: 160px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.1);
    }

    .landing-footer-note {
      margin-top: 20px;
      color: #94a3b8;
      font-size: 11px;
      line-height: 1.7;
    }

    .landing-footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-top: 16px;
    }

    .landing-footer-links a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 11px;
    }

    .landing-reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.65s ease, transform 0.65s ease;
    }

    .landing-reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (min-width: 900px) {

      .landing-hero,
      .landing-story-grid,
      .landing-workflow-layout,
      .landing-download-grid,
      .landing-final__grid {
        grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
      }

      .landing-feature-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .landing-stat-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .landing-section {
        padding: 34px 28px 90px;
      }
    }

    @media (max-width: 899px) {

      .landing-download-meta,
      .landing-feature-grid,
      .landing-stat-grid,
      .landing-metrics {
        grid-template-columns: 1fr;
      }

      .landing-cta-row .landing-button,
      .landing-final__actions .landing-button,
      .landing-download__actions .landing-button {
        width: 100%;
      }

      .landing-topbar__cta {
        display: none;
      }

      .landing-hero__visual {
        min-height: 360px;
      }

      .landing-hero__media,
      .landing-hero__media img {
        min-height: 220px;
      }

      .landing-hero__media .landing-hero__media-caption {
        left: 14px;
        right: 14px;
        bottom: 14px;
        gap: 4px;
      }

      .landing-hero__media .landing-hero__media-caption span {
        font-size: 8px;
      }

      .landing-hero__media .landing-hero__media-caption strong {
        font-size: clamp(0.9rem, 4.4vw, 1.1rem);
      }

      .landing-hero__media .landing-hero__media-caption small {
        font-size: 9.5px;
        line-height: 1.38;
      }

      .landing-node-cloud {
        grid-template-columns: 1fr;
      }

      .landing-hero__hud {
        position: static;
        width: auto;
        margin-bottom: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .landing-reveal,
      .landing-button,
      .landing-train,
      .landing-hero__media img,
      .landing-kicker__pulse,
      .landing-node__dot,
      .landing-route::after,
      .landing-ambient::before,
      .landing-ambient::after {
        animation: none !important;
        transition: none !important;
        transform: none !important;
      }
    }

    @keyframes landingTrain {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(150%);
      }
    }

    @keyframes landingFloat {
      0% {
        transform: translate3d(0, 0, 0) scale(1);
      }

      100% {
        transform: translate3d(4vw, 2vh, 0) scale(1.08);
      }
    }

    @keyframes landingPulse {
      0% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.48);
      }

      70% {
        box-shadow: 0 0 0 12px rgba(34, 197, 94, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
      }
    }

    @keyframes landingTrainMarker {

      0%,
      100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(185px);
      }
    }

    @keyframes landingPhotoFade {
      0% {
        opacity: 0;
        transform: scale(1.03);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .landing-button--secondary {
      background: linear-gradient(135deg, #173768 0%, #25528c 100%);
      color: #fff;
      box-shadow: 0 18px 38px rgba(23, 55, 104, 0.24);
    }

    .landing-download-card__ribbon {
      background: rgba(37, 82, 140, 0.16);
      color: #dbeafe;
    }

    .landing-feature::after {
      background: rgba(148, 163, 184, 0.06);
    }

    .landing-metric__value {
      font-size: clamp(1.45rem, 3vw, 2.1rem);
    }

    .landing-metric__label {
      line-height: 1.55;
    }

    .landing-hero__panel {
      display: grid;
      gap: 16px;
      align-content: start;
      background: linear-gradient(180deg, rgba(8, 17, 36, 0.9) 0%, rgba(11, 26, 54, 0.96) 100%);
    }

    .landing-hero__hud {
      position: static;
      width: auto;
      margin: 0;
    }

    .landing-hero__panel-grid,
    .landing-context-grid {
      display: grid;
      gap: 12px;
    }

    .landing-context-card {
      padding: 18px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(148, 163, 184, 0.14);
    }

    .landing-context-card--feature {
      background:
        linear-gradient(135deg, rgba(37, 82, 140, 0.16), rgba(15, 23, 42, 0.26)),
        rgba(255, 255, 255, 0.03);
    }

    .landing-context-card__eyebrow {
      display: block;
      color: #93c5fd;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .landing-context-card strong {
      display: block;
      margin-top: 8px;
      font-family: 'Sora', 'Inter', sans-serif;
      font-size: clamp(1.25rem, 3vw, 2rem);
      line-height: 1.05;
      color: #f8fafc;
    }

    .landing-context-card span {
      display: block;
      margin-top: 8px;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.65;
    }

    .landing-source-note {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 11px;
      line-height: 1.7;
    }

    .landing-source-note a {
      color: #dbeafe;
      text-decoration: none;
      border-bottom: 1px solid rgba(219, 234, 254, 0.28);
    }

    @media (min-width: 900px) {

      .landing-hero__panel-grid,
      .landing-context-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .landing-context-card--feature {
        grid-column: span 2;
      }
    }

    @media (max-width: 899px) {

      .landing-hero__panel-grid,
      .landing-context-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ==========================================
   SIMPLE LANDING REFRESH
============================================= */
    body.show-marketing-landing {
      background:
        radial-gradient(circle at top, rgba(74, 163, 255, 0.18), transparent 30%),
        linear-gradient(180deg, #dcecff 0%, #cfe4ff 48%, #bed7ff 100%);
    }

    body.show-marketing-landing[data-landing-theme="dark"] {
      background:
        radial-gradient(circle at top, rgba(74, 163, 255, 0.16), transparent 30%),
        linear-gradient(180deg, #081423 0%, #0b1d31 48%, #091523 100%);
    }

    #railsaathi-landing {
      --landing-surface: rgba(255, 255, 255, 0.86);
      --landing-surface-strong: #ffffff;
      --landing-surface-soft: rgba(255, 255, 255, 0.76);
      --landing-surface-overlay: rgba(238, 247, 255, 0.92);

      --landing-border-strong: #abc5e6;

      --landing-muted: #49627f;
      --landing-soft-text: #28466f;
      --landing-accent: #2f68a4;
      --landing-accent-strong: #124e96;
      --landing-accent-contrast: #ffffff;
      --landing-pill: #dbeaff;
      --landing-dot: #9ebfe5;
      --landing-dot-active: #124e96;
      --landing-shadow: 0 20px 44px rgba(18, 52, 96, 0.12);
      --landing-shadow-soft: 0 10px 24px rgba(18, 52, 96, 0.09);
      --landing-shadow-topbar: 0 12px 30px rgba(18, 52, 96, 0.1);
      --landing-theme-button-bg: rgba(255, 255, 255, 0.96);
      --landing-theme-button-icon: #406282;
      --landing-theme-button-active: #124e96;
      --landing-theme-button-active-icon: #ffffff;
      color: #0f172a;
      background:
        linear-gradient(180deg, rgba(244, 249, 255, 0.52) 0%, rgba(219, 235, 255, 0.74) 40%, rgba(196, 221, 249, 0.92) 100%);

    #railsaathi-landing[data-theme="dark"] {
      --landing-surface: rgba(12, 24, 40, 0.84);
      --landing-surface-strong: rgba(9, 19, 33, 0.96);
      --landing-surface-soft: rgba(17, 31, 48, 0.84);
      --landing-surface-overlay: rgba(8, 20, 35, 0.92);
      --landing-border: rgba(125, 211, 252, 0.18);
      --landing-border-strong: rgba(148, 163, 184, 0.26);
      --landing-text: #f4f8ff;
      --landing-muted: #b9cbe0;
      --landing-soft-text: #d7e2f1;
      --landing-accent: #8cc9ff;
      --landing-accent-strong: #4aa3ff;
      --landing-accent-contrast: #06111f;
      --landing-pill: rgba(30, 61, 98, 0.68);
      --landing-dot: rgba(191, 219, 254, 0.42);
      --landing-dot-active: #8cc9ff;
      --landing-shadow: 0 22px 48px rgba(0, 0, 0, 0.34);

      --landing-shadow-topbar: 0 12px 28px rgba(0, 0, 0, 0.3);
      --landing-theme-button-bg: rgba(9, 19, 33, 0.96);
      --landing-theme-button-icon: #b9cbe0;
      --landing-theme-button-active: #8cc9ff;
      --landing-theme-button-active-icon: #06111f;
      color: var(--landing-text);
      background:
        linear-gradient(180deg, rgba(7, 17, 29, 0.96) 0%, rgba(9, 22, 37, 0.94) 46%, rgba(8, 18, 31, 0.98) 100%);
    }

    #railsaathi-landing::before,
    #railsaathi-landing::after {
      content: "";
      position: absolute;
      inset: auto 0 0 0;
      pointer-events: none;
    }

    #railsaathi-landing::before {
      top: 0;
      height: 38vh;
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 255, 255, 0.9), transparent 28%),
        radial-gradient(circle at 82% 0%, rgba(191, 219, 254, 0.52), transparent 22%);
    }

    #railsaathi-landing[data-theme="dark"]::before {
      background:
        radial-gradient(circle at 16% 16%, rgba(74, 163, 255, 0.22), transparent 28%),
        radial-gradient(circle at 84% 0%, rgba(125, 211, 252, 0.12), transparent 22%);
    }

    #railsaathi-landing::after {
      bottom: 4vh;
      left: 50%;
      width: min(1040px, calc(100% - 48px));
      height: 120px;
      transform: translateX(-50%);
      background:
        linear-gradient(180deg, transparent 0%, rgba(15, 23, 42, 0.02) 100%),
        linear-gradient(78deg, transparent 0 44%, rgba(71, 85, 105, 0.16) 44.4%, rgba(71, 85, 105, 0.16) 45.1%, transparent 45.4%) center/100% 100% no-repeat,
        linear-gradient(102deg, transparent 0 55%, rgba(71, 85, 105, 0.16) 55.2%, rgba(71, 85, 105, 0.16) 55.9%, transparent 56.2%) center/100% 100% no-repeat,
        repeating-linear-gradient(90deg, rgba(148, 163, 184, 0.24) 0 20px, transparent 20px 74px) center bottom/100% 18px no-repeat;
      opacity: 0.9;
    }

    #railsaathi-landing[data-theme="dark"]::after {
      opacity: 0.36;
      filter: brightness(0.72);
    }

    .landing-scroll-progress,
    .landing-grid,
    .landing-ambient,
    .landing-orbit {
      display: none;
    }

    .landing-topbar {
      top: 8px;
      width: min(calc(100% - 36px), 840px);
      margin: 0 auto;
      padding: 8px 12px;
      border-radius: 16px;
      background: var(--landing-surface-overlay);
      border-bottom: 1px solid var(--landing-border);
      backdrop-filter: blur(10px);
      gap: 10px;
      flex-wrap: nowrap;
      box-shadow: var(--landing-shadow-topbar);
    }

    .landing-brand {
      gap: 10px;
    }

    .landing-brand__meta {
      min-width: 0;
    }

    .landing-brand__mark {
      width: 42px;
      height: 42px;
      padding: 6px;
      border-radius: 14px;
      box-shadow: var(--landing-shadow-soft);
      background: var(--landing-surface-strong);
    }

    .landing-brand__name {
      font-size: 14px;
      color: var(--landing-text);
    }

    .landing-brand__copy {
      font-size: 9px;
      color: var(--landing-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
    }

    .landing-theme-switch {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--landing-border);
      background: var(--landing-theme-button-bg);
      box-shadow: var(--landing-shadow-soft);
    }

    .landing-theme-switch__button {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--landing-theme-button-icon);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .landing-theme-switch__button:hover {
      transform: translateY(-1px);
    }

    .landing-theme-switch__button.is-active {
      background: var(--landing-theme-button-active);
      color: var(--landing-theme-button-active-icon);
    }

    .landing-topbar__controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-left: auto;
      flex-wrap: nowrap;
      position: relative;
    }

    .landing-language-switch {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--landing-border);
      background: var(--landing-theme-button-bg);
      box-shadow: var(--landing-shadow-soft);
    }

    .landing-language-select-wrap {
      display: none;
      position: relative;
    }

    .landing-language-select {
      display: none;
      min-height: 34px;
      padding: 0 28px 0 12px;
      border-radius: 999px;
      border: 1px solid var(--landing-border);
      background: var(--landing-theme-button-bg);
      color: var(--landing-accent-strong);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      outline: none;
      box-shadow: var(--landing-shadow-soft);
    }

    .landing-language-switch__button {
      min-width: 38px;
      height: 28px;
      padding: 0 10px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--landing-theme-button-icon);
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .landing-language-switch__button[data-lang-option="hi"],
    .landing-language-switch__button[data-lang-option="mr"] {
      font-family: 'Noto Sans Devanagari', 'Inter', sans-serif;
      font-size: 11px;
    }

    .landing-language-switch__button:hover {
      transform: translateY(-1px);
    }

    .landing-language-switch__button.is-active {
      background: var(--landing-theme-button-active);
      color: var(--landing-theme-button-active-icon);
    }

    .landing-language-guide {
      position: absolute;
      top: calc(100% + 10px);
      right: 54px;
      z-index: 7;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 10px;
      width: min(270px, calc(100vw - 36px));
      padding: 12px 14px;
      border-radius: 18px;
      background: var(--landing-surface-strong);
      border: 1px solid var(--landing-border);
      box-shadow: var(--landing-shadow);
    }

    .landing-language-guide[hidden] {
      display: none !important;
    }

    .landing-language-guide::before {
      content: "";
      position: absolute;
      top: -7px;
      right: 106px;
      width: 14px;
      height: 14px;
      background: var(--landing-surface-strong);
      border-top: 1px solid var(--landing-border);
      border-left: 1px solid var(--landing-border);
      transform: rotate(45deg);
    }

    .landing-language-guide__lens {
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--landing-accent-strong);
      color: var(--landing-accent-contrast);
      box-shadow: 0 12px 22px rgba(23, 55, 104, 0.22);
      animation: landingLensPulse 1.7s ease-in-out infinite;
    }

    .landing-language-guide__content {
      display: grid;
      gap: 4px;
    }

    .landing-language-guide__content strong {
      color: var(--landing-text);
      font-family: 'Sora', 'Inter', sans-serif;
      font-size: 12px;
      line-height: 1.2;
    }

    .landing-language-guide__content span {
      color: var(--landing-muted);
      font-family: 'Inter', sans-serif;
      font-size: 10.5px;
      line-height: 1.5;
    }

    .landing-topbar__cta {
      background: var(--landing-accent-strong);
      color: var(--landing-accent-contrast);
      border: 1px solid var(--landing-accent-strong);
      box-shadow: none;
      min-height: 34px;
      padding: 0 12px;
      font-size: 10px;
      font-family: 'Inter', sans-serif;
    }

    .landing-section {
      width: min(100%, 1120px);
    }

    .landing-hero {
      min-height: auto;
      padding-top: 38px;
      padding-bottom: 52px;
      gap: 32px;
    }

    .landing-kicker {
      background: var(--landing-surface-strong);
      border: 1px solid var(--landing-border);
      color: var(--landing-accent);
      box-shadow: var(--landing-shadow-soft);
    }

    .landing-headline {
      color: var(--landing-text);
      margin: 14px 0 10px;
      max-width: 12ch;
      font-family: 'Cormorant Garamond', 'Times New Roman', serif;
      font-size: clamp(2.8rem, 8vw, 5rem);
      line-height: 0.92;
      letter-spacing: -0.03em;
    }

    .landing-headline span {
      color: var(--landing-accent);
      font-family: 'Sora', 'Inter', sans-serif;
      font-size: clamp(1.1rem, 3vw, 1.65rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-top: 10px;
    }

    #landing-headline-main {
      position: relative;
      display: inline-block;
      min-height: 1.05em;
      color: var(--landing-text) !important;
      font-family: 'Cormorant Garamond', 'Sora', 'Inter', sans-serif !important;
      font-size: clamp(2.5rem, 8vw, 4.6rem) !important;
      font-weight: 800 !important;
      line-height: 0.98 !important;
      letter-spacing: -0.04em !important;
      margin-top: 0 !important;
      text-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
    }

    #landing-headline-main::after {
      content: "|";
      margin-left: 4px;
      color: var(--landing-accent);
      animation: landingCaretBlink 0.9s step-end infinite;
    }

    .landing-manifesto {
      margin: 0;
      max-width: 44rem;
      padding: 0;
      border-radius: 0;
      background: none;
      border: 0;
      box-shadow: none;
      color: var(--landing-soft-text);
      font-family: 'Poppins', 'Inter', sans-serif;
      font-size: clamp(0.96rem, 1.7vw, 1.06rem);
      font-weight: 500;
      line-height: 1.75;
      letter-spacing: 0.01em;
    }

    #railsaathi-landing[data-theme="dark"] .landing-manifesto {
      background: none;
    }

    .landing-button {
      border-radius: 14px;
    }

    .landing-button--primary,
    .landing-button--secondary {
      background: var(--landing-accent-strong);
      color: var(--landing-accent-contrast);
      box-shadow: none;
    }

    .landing-button--ghost {
      background: var(--landing-surface-strong);
      color: var(--landing-accent-strong);
      border: 1px solid var(--landing-border-strong);
    }

    .landing-button:hover {
      transform: translateY(-1px);
    }

    .landing-metrics {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .landing-metric {
      position: relative;
      display: grid;
      align-content: start;
      gap: 8px;
      min-height: 136px;
      padding: 16px;
      border-radius: 22px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--landing-surface-strong) 90%, transparent) 0%, var(--landing-surface) 100%);
      border: 1px solid var(--landing-border);
      box-shadow: var(--landing-shadow-soft);
      overflow: hidden;
    }

    .landing-metric::before,
    .landing-context-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 16px;
      right: 16px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--landing-accent-strong), color-mix(in srgb, var(--landing-accent) 36%, transparent));
    }

    .landing-metric__value {
      display: block;
      font-size: clamp(1.4rem, 3vw, 1.85rem);
      color: var(--landing-accent-strong);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .landing-metric__label {
      color: var(--landing-muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .landing-hero__visual {
      min-height: auto;
      margin-top: -6px;
    }

    .landing-hero__panel,
    .landing-story-card,
    .landing-download-card,
    .landing-faq,
    .landing-final__panel {
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
    }

    .landing-hero__panel {
      display: grid;
      gap: 18px;
    }

    .landing-hero__media {
      min-height: 320px;
      border: 1px solid var(--landing-border);
      border-radius: 30px;
      background: var(--landing-surface-strong);
      box-shadow: var(--landing-shadow);
    }

    .landing-hero__media .landing-hero__media-caption {
      left: 16px;
      right: 16px;
      bottom: 16px;
      gap: 5px;
    }

    .landing-hero__media .landing-hero__media-caption span {
      font-size: 9px;
      letter-spacing: 0.12em;
    }

    .landing-hero__media .landing-hero__media-caption strong {
      font-size: clamp(1rem, 2.4vw, 1.35rem);
      line-height: 1.16;
      max-width: 30rem;
    }

    .landing-hero__media .landing-hero__media-caption small {
      font-size: 10.5px;
      line-height: 1.45;
      max-width: 28rem;
    }

    .landing-marvel-gallery {
      position: relative;
      min-height: 290px;
      overflow: hidden;
      border-radius: 30px;
      border: 1px solid var(--landing-border);
      background: var(--landing-surface-strong);
      box-shadow: var(--landing-shadow);
    }

    .landing-marvel-gallery img {
      width: 100%;
      height: 100%;
      min-height: 290px;
      display: block;
      object-fit: contain;
    }

    .landing-marvel-gallery.is-animating img {
      animation: landingMarvelSwap 1.35s ease-out forwards;
    }

    .landing-marvel-gallery__metric {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      margin-top: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      font-family: 'Sora', 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.03em;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .landing-hero__hud {
      position: static;
      width: auto;
      padding: 0;
      background: transparent;
      border: 0;
      margin-top: 2px;
    }

    .landing-section-label {
      color: var(--landing-accent);
    }

    .landing-section-label::before {
      background: linear-gradient(90deg, var(--landing-accent), transparent);
    }

    .landing-hero__hud-title,
    .landing-section-title,
    .landing-download__heading,
    .landing-final__title {
      color: var(--landing-text);
    }

    .landing-hero__hud-copy,
    .landing-section-copy,
    .landing-download__copy,
    .landing-final__copy {
      color: var(--landing-muted);
    }

    .landing-hero__panel-grid,
    .landing-download-grid {
      gap: 14px;
    }

    .landing-hero__panel-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .landing-marvel-dots {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.34);
      backdrop-filter: blur(8px);
    }

    .landing-marvel-dot {
      width: 10px;
      height: 10px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: var(--landing-dot);
      cursor: pointer;
      transition: width 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .landing-marvel-dot:hover {
      transform: scale(1.05);
    }

    .landing-marvel-dot.is-active {
      width: 28px;
      background: var(--landing-dot-active);
    }

    .landing-context-card {
      position: relative;
      display: grid;
      align-content: start;
      gap: 8px;
      min-height: 136px;
      padding: 16px;
      border-radius: 22px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--landing-surface-strong) 90%, transparent) 0%, var(--landing-surface) 100%);
      border: 1px solid var(--landing-border);
      box-shadow: var(--landing-shadow-soft);
      overflow: hidden;
    }

    .landing-context-card--feature {
      background: linear-gradient(180deg, color-mix(in srgb, var(--landing-accent) 10%, var(--landing-surface-strong)) 0%, var(--landing-surface) 100%);
    }

    .landing-context-card__eyebrow {
      display: block;
      color: var(--landing-accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .landing-context-card strong {
      display: block;
      font-size: clamp(1.15rem, 3vw, 1.5rem);
      color: var(--landing-text);
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .landing-context-card span {
      color: var(--landing-muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .landing-hero__panel-grid>.landing-context-card:last-child:nth-child(odd) {
      grid-column: 1 / -1;
    }

    .landing-source-note {
      color: var(--landing-muted);
    }

    .landing-source-note a {
      color: var(--landing-accent-strong);
      border-bottom-color: color-mix(in srgb, var(--landing-accent-strong) 30%, transparent);
    }

    .landing-seo-section {
      padding-top: 8px;
    }

    .landing-seo-grid {
      display: grid;
      gap: 14px;
      margin-top: 18px;
    }

    .landing-seo-copy,
    .landing-seo-list li {
      color: var(--landing-muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .landing-seo-copy {
      max-width: 48rem;
      margin: 0;
    }

    .landing-seo-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .landing-seo-list li {
      padding: 12px 14px;
      border-left: 3px solid var(--landing-accent);
      background: var(--landing-surface-soft);
      border-radius: 0 12px 12px 0;
    }

    .landing-seo-list strong {
      color: var(--landing-text);
    }

    .landing-seo-disclaimer {
      margin: 18px 0 0;
      color: var(--landing-muted);
      font-size: 11px;
      line-height: 1.7;
    }

    .landing-download-card__ribbon {
      background: var(--landing-pill);
      color: var(--landing-accent);
      font-family: 'Inter', sans-serif;
    }

    .landing-download-meta,
    .landing-install-steps {
      margin-top: 16px;
    }

    .landing-download-grid .landing-story-card {
      padding: 20px;
      border-radius: 24px;
      background: var(--landing-surface);
      border: 1px solid var(--landing-border);
      box-shadow: var(--landing-shadow);
    }

    .landing-download-inline-note {
      display: grid;
      gap: 6px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--landing-border);
    }

    .landing-download-inline-note span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--landing-accent);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-family: 'Inter', sans-serif;
    }

    .landing-download-inline-note p {
      margin: 0;
      color: var(--landing-text);
      font-family: 'Italiana', 'Cormorant Garamond', serif;
      font-size: clamp(1.02rem, 2.4vw, 1.34rem);
      font-style: italic;
      line-height: 1.28;
      letter-spacing: 0.03em;
    }

    .landing-download-meta li,
    .landing-install-steps li {
      background: var(--landing-surface-soft);
      border: 1px solid var(--landing-border);
      box-shadow: none;
    }

    .landing-install-steps {
      gap: 12px;
      padding: 0;
    }

    .landing-install-steps li {
      grid-template-columns: 34px 1fr;
      align-items: start;
      padding: 14px 16px;
      color: var(--landing-accent-strong);
    }

    .landing-install-steps span {
      display: block;
      color: var(--landing-soft-text);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.6;
    }

    .landing-install-steps b {
      width: 32px;
      height: 32px;
      background: color-mix(in srgb, var(--landing-accent) 14%, var(--landing-surface-strong));
      color: var(--landing-accent-strong);
    }

    .landing-faq {
      margin-top: 16px;
    }

    .landing-faq details {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #d7e0ea;
    }

    .landing-faq p {
      color: #516173;
    }

    .landing-leadership-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      align-items: start;
    }

    .landing-contact-card {
      padding: 18px;
      border-radius: 24px;
      background: var(--landing-surface);
      border: 1px solid var(--landing-border);
      box-shadow: var(--landing-shadow);
    }

    .landing-leader-card {
      display: grid;
      gap: 8px;
      padding: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .landing-leader-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      border-radius: 18px;
      background: color-mix(in srgb, var(--landing-surface-strong) 92%, transparent);
      border: 1px solid var(--landing-border);
    }

    .landing-leader-card span,
    .landing-contact-card span {
      display: block;
      color: var(--landing-accent);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .landing-leader-card strong,
    .landing-contact-card strong {
      display: block;
      color: var(--landing-text);
      font-family: 'Sora', 'Inter', sans-serif;
      font-size: 0.88rem;
      line-height: 1.18;
    }

    #landing-leadership {
      padding-top: 4px;
      padding-bottom: 40px;
    }

    #landing-leadership>.landing-section-label {
      margin: 0 0 10px;
    }

    .landing-contact-card {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .landing-contact-card p {
      margin: 0;
      color: var(--landing-muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .landing-contact-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: fit-content;
      min-height: 46px;
      padding: 0 16px;
      border-radius: 999px;
      text-decoration: none;
      background: #e0f2fe;
      color: #0f172a;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 16px 30px rgba(56, 189, 248, 0.22);
    }

    .landing-contact-link i {
      font-size: 17px;
    }

    .landing-legal-note {
      margin: 18px 0 0;
      color: var(--landing-muted);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      line-height: 1.7;
    }

    #main-footer p:nth-child(2) {
      display: none;
    }

    @media (min-width: 900px) {
      .landing-hero {
        grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
      }

      .landing-download-grid {
        grid-template-columns: minmax(0, 1fr) minmax(0, 0.9fr);
      }
    }

    @media (max-width: 899px) {
      .landing-topbar {
        width: min(calc(100% - 14px), 860px);
        padding: 8px 10px;
      }

      .landing-topbar__controls {
        justify-content: flex-end;
      }

      .landing-hero__media,
      .landing-hero__media img {
        min-height: 220px;
      }

      .landing-metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));

    /* ==========================================
   LOGIN SCREEN STYLES
============================================= */
    #login-screen {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 1rem;
      background: #0000CD;
      animation: none;
      overflow: hidden;
    }

    #login-screen .track-container {
      position: absolute;
      bottom: 8%;
      width: 100%;
      height: 8px;
      background: #334155;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }

    #login-screen .sleepers {
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(90deg, transparent 50%, #0f172a 50%);
      background-size: 30px 100%;
      animation: moveTracks 0.4s linear infinite;
    }

    #login-screen .login-train {
      position: absolute;
      bottom: calc(8% + 8px);
      left: -500px;
      width: 320px;
      height: 42px;
      background: linear-gradient(to bottom, #cf1d1d 0%, #b91c1c 50%, #7f1d1d 100%);
      border-radius: 4px 30px 2px 5px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6);
      animation: trainRun 12s linear infinite;
      z-index: 10;
      display: flex;
      align-items: center;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
    }

    #login-screen .login-train::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 50px;
      width: 220px;
      height: 14px;
      background-image: repeating-linear-gradient(90deg, #1e293b 0px, #1e293b 15px, transparent 15px, transparent 25px);
      opacity: 0.8;
    }

    #login-screen .login-train::after {
      content: "INDIAN RAILWAYS";
      position: absolute;
      bottom: 4px;
      left: 60px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      white-space: nowrap;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }

    #login-particles-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .login-particle {
      position: absolute;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      pointer-events: none;
      animation: floatParticle 8s infinite linear;
    }

    .login-glass-card {
      background: rgba(2, 6, 23, 0.78);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: cardFadeIn 0.8s ease-out forwards;
      position: relative;
      z-index: 30;
      width: min(100%, 340px);
      max-width: 340px;
      padding: 1.5rem;
      border-radius: 1rem;
    }

    .login-modal-container {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999999;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-modal-container.active {
      display: flex;
    }

    .login-input-focus:focus {
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
      border-color: #60a5fa;
    }

    .login-btn-primary {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .login-spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: loginSpin 0.8s linear infinite;
    }

    #login-error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      margin-top: 8px;
      display: none;
    }

    .login-download-status {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 41;
      width: min(320px, calc(100vw - 36px));
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.32);
      color: #fff;
      display: none;
      pointer-events: none;
    }

    .login-download-status__title {
      font-size: 12px;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .login-download-status__text {
      font-size: 11px;
      line-height: 1.5;
      color: #cbd5e1;
      margin: 0;
    }

    .login-download-status__bar {
      margin-top: 10px;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }

    .login-download-status__bar span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #60a5fa 0%, #22c55e 100%);
      transition: width 0.3s ease;
    }

    .login-download-status.is-success .login-download-status__bar span {
      width: 100% !important;
    }

    @media (max-width: 640px) {
      #login-screen {
        align-items: center;
        justify-content: center;
        overflow-y: auto;
        padding: 1rem 0.75rem;
        gap: 0;
      }

      #login-screen>.login-glass-card {
        margin: 0 auto;
        padding: 2rem 1.1rem 1.1rem;
        transform: translateY(-3vh);
      }

      #login-screen .login-brand-mark {
        width: 84px !important;
        height: 84px !important;
        display: flex !important;
        visibility: visible !important;
        opacity: 1 !important;
      }

      #login-screen .login-brand-mark img {
        display: block !important;
        width: 100% !important;
        height: 100% !important;
        visibility: visible !important;
        opacity: 1 !important;
      }

      .login-download-status {
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: auto;
      }
    }

    @media (max-height: 760px) and (max-width: 700px) {
      #login-screen {
        align-items: center;
        justify-content: center;
        overflow-y: auto;
        padding-top: 1rem;
        padding-bottom: 1rem;
        gap: 0;
      }

      .login-glass-card {
        margin-top: 0;
      }
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes moveTracks {
      from {
        background-position: 0 0;
      }

      to {
        background-position: -30px 0;
      }
    }

    @keyframes trainRun {
      0% {
        left: -500px;
      }

      100% {
        left: 120%;
      }
    }

    @keyframes floatParticle {
      0% {
        transform: translateY(110vh) translateX(0);
        opacity: 0;
      }

      50% {
        opacity: 0.4;
      }

      100% {
        transform: translateY(-10vh) translateX(20px);
        opacity: 0;
      }
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes loginSpin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ============================================
   MATERIAL CLOCK TIME PICKER
   ============================================ */
    #clock-picker-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      animation: fadeIn 0.2s ease;
    }

    .clock-modal {
      background: #fff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      width: 320px;
      max-width: 95vw;
      font-family: 'Poppins', sans-serif;
    }

    .clock-header {
      background: #1d4ed8;
      color: white;
      padding: 20px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .clock-header-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      opacity: 0.75;
      text-transform: uppercase;
    }

    .clock-time-display {
      display: flex;
      align-items: center;
      gap: 4px;
      line-height: 1;
    }

    .clock-hh,
    .clock-mm {
      font-size: 52px;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 10px;
      transition: all 0.15s;
      line-height: 1;
    }

    .clock-hh.active,
    .clock-mm.active {
      background: rgba(255, 255, 255, 0.22);
    }

    .clock-hh:not(.active),
    .clock-mm:not(.active) {
      opacity: 0.55;
    }

    .clock-sep {
      font-size: 52px;
      font-weight: 700;
      opacity: 0.8;
    }

    .clock-body {
      padding: 20px 24px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .clock-face-wrap {
      position: relative;
      width: 256px;
      height: 256px;
      border-radius: 50%;
      background: #f0f4ff;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
      touch-action: none;
    }

    .clock-center-dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #1d4ed8;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
    }

    .clock-hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      width: 2px;
      margin-left: -1px;
      background: #1d4ed8;
      border-radius: 2px 2px 0 0;
      z-index: 2;
      transition: transform 0.15s cubic-bezier(.4, 0, .2, 1), height 0.15s;
    }

    .clock-hand-tip {
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #1d4ed8;
    }

    .clock-number {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      transform: translate(-50%, -50%);
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      z-index: 4;
      pointer-events: none;
      line-height: 1;
    }

    .clock-number.selected {
      background: #1d4ed8;
      color: white;
    }

    .clock-number.inner {
      font-size: 11px;
      font-weight: 500;
      color: #475569;
    }

    .clock-number.min-major {
      font-size: 12px;
      font-weight: 600;
    }

    .clock-number.min-minor {
      font-size: 10px;
      color: #94a3b8;
    }

    .clock-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 16px 16px;
    }

    .clock-btn-cancel {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      background: transparent;
      font-weight: 700;
      font-size: 13px;
      color: #1d4ed8;
      cursor: pointer;
      transition: background 0.15s;
      font-family: 'Poppins', sans-serif;
    }

    .clock-btn-cancel:hover {
      background: #eff6ff;
    }

    .clock-btn-ok {
      padding: 10px 24px;
      border-radius: 20px;
      border: none;
      background: #1d4ed8;
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.35);
      font-family: 'Poppins', sans-serif;
    }

    .clock-btn-ok:hover {
      background: #1e40af;
    }

    .clock-btn-ok:active {
      transform: scale(0.96);
    }

    .clock-step-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .clock-step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #cbd5e1;
      transition: background 0.2s;
    }

    .clock-step-dot.active {
      background: #1d4ed8;
    }

    .ta-time-btn {
      background: white;
      border: 2px solid #cbd5e1;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .ta-time-btn:hover {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .ta-time-btn.has-value {
      border-color: #22c55e;
      background: #f0fdf4;
    }

<script>
  (function initJanmashtamiFestiveEngine() {
    const expireTimestamp = new Date('2026-09-05T00:00:00+05:30').getTime();
    if (Date.now() >= expireTimestamp) {
      const banner = document.getElementById('jm-landing-banner');
      if (banner) banner.remove();
      const styles = document.getElementById('jm-festive-styles');
      if (styles) styles.remove();
      const overlay = document.getElementById('jm-prelanding-overlay');
      if (overlay) overlay.remove();
      return;
    }

    const video = document.getElementById('jm-banner-video');
    const overlay = document.getElementById('jm-prelanding-overlay');
    const stage = document.getElementById('jm-krishna-stage');
    const canvas = document.getElementById('jm-reconstruction-canvas');
    const shimmerLayer = document.getElementById('jm-shimmer-layer');

    if (video) {
      video.setAttribute('playsinline', '');
      video.setAttribute('webkit-playsinline', '');
      video.playsInline = true;
      video.playbackRate = 1.25;
      video.defaultPlaybackRate = 1.25;
      video.volume = 1.0;
    }

    function playVideoWithSound(unmuted = true) {
      if (!video) return;
      video.playbackRate = 1.25;
      video.defaultPlaybackRate = 1.25;
      video.volume = 1.0;

      if (unmuted) {
        video.muted = false;
        video.defaultMuted = false;
        video.removeAttribute('muted');
      } else {
        video.muted = true;
      }

      const p = video.play();
      if (p !== undefined) {
        p.then(function() {
          video.playbackRate = 1.25;
          if (!video.muted) {
            removeAudioListeners();
          }
        }).catch(function() {
          // If browser restricts unmuted autoplay, start video immediately and unlock sound on first interaction
          video.muted = true;
          video.play().then(function() {
            video.playbackRate = 1.25;
          }).catch(function() {});
        });
      }
    }

    function unlockSoundOnGesture() {
      if (!video) return;
      video.muted = false;
      video.defaultMuted = false;
      video.removeAttribute('muted');
      video.volume = 1.0;
      video.playbackRate = 1.25;
      const p = video.play();
      if (p !== undefined) {
        p.then(function() {
          video.playbackRate = 1.25;
          removeAudioListeners();
        }).catch(function() {});
      }
    }

    const gestureEvents = ['touchstart', 'touchend', 'pointerdown', 'mousedown', 'click', 'keydown', 'scroll'];
    let listenersAttached = false;
    function attachAudioListeners() {
      if (listenersAttached) return;
      listenersAttached = true;
      gestureEvents.forEach(function(evt) {
        window.addEventListener(evt, unlockSoundOnGesture, { capture: true, passive: true });
        document.addEventListener(evt, unlockSoundOnGesture, { capture: true, passive: true });
      });
    }

    function removeAudioListeners() {
      if (!listenersAttached) return;
      listenersAttached = false;
      gestureEvents.forEach(function(evt) {
        window.removeEventListener(evt, unlockSoundOnGesture, { capture: true });
        document.removeEventListener(evt, unlockSoundOnGesture, { capture: true });
      });
    }

    attachAudioListeners();

    // Check if user already saw splash in this session
    const urlParams = new URLSearchParams(window.location.search);
    const hasVisited = sessionStorage.getItem('visited_jm_splash') === 'true' || urlParams.has('skip_splash');

    if (hasVisited) {
      if (overlay) overlay.remove();
      playVideoWithSound(true);
      return;
    }

    // First visit in session: SHOW IN-PLACE PRELANDING OVERLAY
    if (overlay) {
      overlay.style.display = 'flex';
    }

    let isDismissed = false;
    function dismissOverlayAndPlaySound() {
      if (isDismissed) return;
      isDismissed = true;
      try { sessionStorage.setItem('visited_jm_splash', 'true'); } catch (e) {}

      // UNMUTE AND PLAY VIDEO WITH FULL SOUND
      playVideoWithSound(true);

      if (overlay) {
        overlay.classList.add('fade-out');
        setTimeout(function() {
          overlay.remove();
        }, 550);
      }
    }

    if (overlay) {

      const imgKrishna = new Image();
      imgKrishna.src = KRISHNA_DATA_URL;

      const imgLogo = new Image();
      imgLogo.src = LOGO_DATA_URL;

      let particles = [];
      let animStartTime = 0;
      let imgLoadedCount = 0;
      let displayW = 0;
      let displayH = 0;
      let cropParams = { sx: 0, sy: 0, sWidth: 0, sHeight: 0 };
      let compositeCanvas = null;
      let shimmerTriggered = false;

      const ASSEMBLY_START = 1100;
      const ASSEMBLY_END = 4100;
      const SHIMMER_TIME = 4100;
      const SHARP_HOLD_TIME = 4900;
      const DISMISS_TIME = 5500;

      function onAssetsReady() {
        imgLoadedCount++;
        if (imgLoadedCount >= 2) {
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function() {
              initOverlayDimensionsAndParticles();
              requestAnimationFrame(overlayRenderLoop);
            });
          } else {
            initOverlayDimensionsAndParticles();
            requestAnimationFrame(overlayRenderLoop);
          }
        }
      }

      imgKrishna.onload = onAssetsReady;
      imgLogo.onload = onAssetsReady;
      if (imgKrishna.complete) onAssetsReady();
      if (imgLogo.complete) onAssetsReady();

      function initOverlayDimensionsAndParticles() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const naturalW = imgKrishna.naturalWidth || 720;
        const naturalH = imgKrishna.naturalHeight || 1280;
        const naturalAspect = naturalW / naturalH;

        const isMobile = window.innerWidth <= 640;

        if (isMobile) {
          displayW = window.innerWidth;
          displayH = window.innerHeight;

          const screenAspect = displayW / displayH;
          if (screenAspect > naturalAspect) {
            cropParams.sWidth = naturalW;
            cropParams.sHeight = naturalW / screenAspect;
            cropParams.sx = 0;
            cropParams.sy = (naturalH - cropParams.sHeight) * 0.25;
          } else {
            cropParams.sHeight = naturalH;
            cropParams.sWidth = naturalH * screenAspect;
            cropParams.sx = (naturalW - cropParams.sWidth) / 2;
            cropParams.sy = 0;
          }
        } else {
          const maxW = window.innerWidth * 0.90;
          const maxH = window.innerHeight * 0.90;

          if (maxW / maxH > naturalAspect) {
            displayH = maxH;
            displayW = maxH * naturalAspect;
          } else {
            displayW = maxW;
            displayH = maxW / naturalAspect;
          }

          cropParams.sx = 0;
          cropParams.sy = 0;
          cropParams.sWidth = naturalW;
          cropParams.sHeight = naturalH;
        }

        displayW = Math.round(displayW);
        displayH = Math.round(displayH);

        stage.style.width = displayW + 'px';
        stage.style.height = displayH + 'px';

        canvas.width = Math.round(displayW * dpr);
        canvas.height = Math.round(displayH * dpr);
        ctx.scale(dpr, dpr);

        compositeCanvas = document.createElement('canvas');
        compositeCanvas.width = Math.round(displayW * dpr);
        compositeCanvas.height = Math.round(displayH * dpr);
        const compCtx = compositeCanvas.getContext('2d');
        compCtx.scale(dpr, dpr);

        compCtx.drawImage(
          imgKrishna,
          cropParams.sx, cropParams.sy, cropParams.sWidth, cropParams.sHeight,
          0, 0, displayW, displayH
        );

        const logoPadding = isMobile ? 16 : 20;
        const logoSize = isMobile ? 32 : 38;

        compCtx.save();
        compCtx.beginPath();
        compCtx.arc(logoPadding + logoSize / 2, logoPadding + logoSize / 2, logoSize / 2, 0, Math.PI * 2);
        compCtx.clip();
        compCtx.drawImage(imgLogo, logoPadding, logoPadding, logoSize, logoSize);
        compCtx.restore();

        compCtx.save();
        compCtx.beginPath();
        compCtx.arc(logoPadding + logoSize / 2, logoPadding + logoSize / 2, logoSize / 2, 0, Math.PI * 2);
        compCtx.strokeStyle = 'rgba(250, 204, 21, 0.7)';
        compCtx.lineWidth = 1.5;
        compCtx.stroke();
        compCtx.restore();

        const textPaddingRight = isMobile ? 16 : 22;
        const textCenterY = logoPadding + logoSize / 2;
        const fontSize = isMobile ? 14 : 16;

        compCtx.save();
        compCtx.font = '800 ' + fontSize + 'px Cinzel, Poppins, sans-serif';
        compCtx.textAlign = 'right';
        compCtx.textBaseline = 'middle';

        const textGradient = compCtx.createLinearGradient(
          displayW - textPaddingRight - 120, textCenterY - 10,
          displayW - textPaddingRight, textCenterY + 10
        );
        textGradient.addColorStop(0, '#ffffff');
        textGradient.addColorStop(0.35, '#fef08a');
        textGradient.addColorStop(0.7, '#facc15');
        textGradient.addColorStop(1, '#ca8a04');

        compCtx.shadowColor = 'rgba(0, 0, 0, 0.85)';
        compCtx.shadowBlur = 6;
        compCtx.shadowOffsetX = 0;
        compCtx.shadowOffsetY = 2;

        compCtx.fillStyle = textGradient;
        compCtx.letterSpacing = '2px';
        compCtx.fillText('RAILSAATHI', displayW - textPaddingRight, textCenterY);
        compCtx.restore();

        const cols = isMobile ? 120 : 150;
        const cellSize = displayW / cols;
        const rows = Math.ceil(displayH / cellSize);

        const sampleCanvas = document.createElement('canvas');
        sampleCanvas.width = cols;
        sampleCanvas.height = rows;
        const sCtx = sampleCanvas.getContext('2d');
        sCtx.drawImage(compositeCanvas, 0, 0, cols, rows);
        const imgData = sCtx.getImageData(0, 0, cols, rows).data;

        particles = [];
        const centerX = displayW / 2;
        const centerY = displayH * (isMobile ? 0.45 : 0.5);
        const maxDist = Math.sqrt(centerX * centerX + centerY * centerY);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const idx = (r * cols + c) * 4;
            const red = imgData[idx];
            const green = imgData[idx + 1];
            const blue = imgData[idx + 2];
            const alpha = imgData[idx + 3] / 255;

            if (alpha < 0.05) continue;

            const targetX = c * cellSize;
            const targetY = r * cellSize;

            const dx = targetX - centerX;
            const dy = targetY - centerY;
            const distFromCenter = Math.sqrt(dx * dx + dy * dy);
            const normDist = distFromCenter / maxDist;

            const staggerDelay = normDist * 1600 + (Math.random() - 0.5) * 500;

            const scatterAngle = Math.random() * Math.PI * 2;
            const scatterDistance = 70 + Math.random() * (isMobile ? 180 : 280);
            const startX = targetX + Math.cos(scatterAngle) * scatterDistance;
            const startY = targetY + Math.sin(scatterAngle) * scatterDistance;

            const driftSpeed = 0.8 + Math.random() * 1.5;
            const driftAmpX = 12 + Math.random() * 20;
            const driftAmpY = 12 + Math.random() * 20;
            const driftPhase = Math.random() * Math.PI * 2;

            particles.push({
              targetX,
              targetY,
              startX,
              startY,
              r: red,
              g: green,
              b: blue,
              size: cellSize,
              staggerDelay,
              driftSpeed,
              driftAmpX,
              driftAmpY,
              driftPhase
            });
          }
        }

        for (let i = particles.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = particles[i];
          particles[i] = particles[j];
          particles[j] = temp;
        }

        animStartTime = performance.now();
      }

      function easeMagnetic(t) {
        return t < 0.5
          ? 4 * t * t * t
          : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function overlayRenderLoop(now) {
        if (isDismissed) return;
        if (!animStartTime) animStartTime = now;
        const elapsed = now - animStartTime;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, displayW, displayH);

        if (elapsed >= SHARP_HOLD_TIME) {
          if (compositeCanvas) {
            ctx.drawImage(compositeCanvas, 0, 0, displayW, displayH);
          }

          if (elapsed >= DISMISS_TIME) {
            dismissOverlayAndPlaySound();
            return;
          }

          requestAnimationFrame(overlayRenderLoop);
          return;
        }

        if (elapsed >= SHIMMER_TIME && !shimmerTriggered) {
          shimmerTriggered = true;
          if (shimmerLayer) shimmerLayer.classList.add('active');
        }

        const timeSec = elapsed / 1000;
        const len = particles.length;

        for (let i = 0; i < len; i++) {
          const p = particles[i];

          const pAssemblyStart = ASSEMBLY_START + p.staggerDelay;
          const pAssemblyDuration = 1800;

          let currentX, currentY, currentSize, currentAlpha;

          if (elapsed < pAssemblyStart) {
            const driftT = timeSec * p.driftSpeed + p.driftPhase;
            currentX = p.startX + Math.sin(driftT) * p.driftAmpX;
            currentY = p.startY + Math.cos(driftT * 0.9) * p.driftAmpY;

            currentSize = p.size * 1.5;
            currentAlpha = 0.35 + 0.35 * Math.sin(driftT);
          } else {
            const progress = Math.min(1, (elapsed - pAssemblyStart) / pAssemblyDuration);
            const eased = easeMagnetic(progress);

            const driftDecay = (1 - eased);
            const driftT = timeSec * p.driftSpeed + p.driftPhase;
            const driftX = Math.sin(driftT) * p.driftAmpX * driftDecay;
            const driftY = Math.cos(driftT * 0.9) * p.driftAmpY * driftDecay;

            currentX = p.startX + (p.targetX - p.startX) * eased + driftX;
            currentY = p.startY + (p.targetY - p.startY) * eased + driftY;

            currentSize = p.size * (1.5 - 0.5 * eased);
            currentAlpha = 0.4 + 0.6 * eased;
          }

          ctx.fillStyle = 'rgba(' + p.r + ',' + p.g + ',' + p.b + ',' + currentAlpha.toFixed(2) + ')';
          ctx.fillRect(currentX, currentY, currentSize + 0.3, currentSize + 0.3);
        }

        if (elapsed > ASSEMBLY_END && compositeCanvas) {
          const blendProgress = Math.min(1, (elapsed - ASSEMBLY_END) / (SHARP_HOLD_TIME - ASSEMBLY_END));
          ctx.globalAlpha = blendProgress;
          ctx.drawImage(compositeCanvas, 0, 0, displayW, displayH);
          ctx.globalAlpha = 1.0;
        }

        requestAnimationFrame(overlayRenderLoop);
      }
    }
  })();
