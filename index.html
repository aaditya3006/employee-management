<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Railsaathi | Maintenance</title>

<!-- Preload responsive maintenance images for fast display -->
<link rel="preload" as="image" href="maintenancesp.png" media="(max-width: 768px)">
<link rel="preload" as="image" href="maintenancelp.png" media="(min-width: 769px)">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    background: #0a0d14;
}

body {
    font-family: Arial, sans-serif;
    color: #172033;

    /* Never create unnecessary scrolling */
    overflow: hidden;
    position: relative;
}

/* Fallback / Initial Loading Card Screen */
.page {
    width: 100vw;
    height: 100vh;
    min-height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: clamp(15px, 3vw, 40px);
    background: #f5f7fa;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
}

/* Main card */
.card {
    width: min(900px, 100%);
    height: min(600px, 90vh);

    background: white;

    border-radius: 28px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    padding: clamp(20px, 5vw, 50px);

    box-shadow:
        0 20px 60px rgba(0,0,0,.10);

    border: 1px solid #e9edf2;
}

/* Logo */
.worker {
    width: clamp(100px, 15vw, 170px);
    height: auto;

    object-fit: contain;

    margin-bottom: 12px;
}

/* Logo */
.brand {
    font-size: clamp(25px, 4vw, 38px);
    font-weight: 800;

    color: #172033;

    margin-bottom: 4px;
}

.brand span {
    color: #f47716;
}

.tagline {
    font-size: clamp(8px, 1.2vw, 11px);
    letter-spacing: 4px;
    color: #8a929d;

    margin-bottom: clamp(20px, 4vh, 35px);
}

/* Maintenance */
.icon {
    font-size: clamp(30px, 4vw, 45px);
    margin-bottom: 8px;
}

h1 {
    font-size: clamp(30px, 5vw, 55px);
    line-height: 1;

    color: #172033;

    margin-bottom: 12px;
}

h1 span {
    color: #f47716;
}

.message {
    font-size: clamp(13px, 1.5vw, 16px);
    color: #7a8491;

    margin-bottom: 25px;
}

/* Progress */
.progress-wrapper {
    width: min(350px, 75vw);
}

.progress {
    width: 100%;
    height: 7px;

    background: #edf0f3;

    border-radius: 20px;

    overflow: hidden;
}

.progress-bar {
    width: 65%;
    height: 100%;

    background: #f47716;

    border-radius: inherit;

    animation: loading 2s ease-in-out infinite alternate;
}

@keyframes loading {
    from {
        width: 55%;
    }

    to {
        width: 75%;
    }
}

.progress-text {
    margin-top: 8px;

    font-size: 10px;
    color: #9aa2ad;

    letter-spacing: 2px;
}

/* Bottom */
.bottom {
    margin-top: 25px;

    font-size: clamp(12px, 1.5vw, 14px);

    color: #555e69;
}

.bottom span {
    color: #f47716;
}

/* Small phones */
@media (max-width: 480px) {
    .page {
        padding: 12px;
    }

    .card {
        width: 100%;
        height: 100%;
        max-height: 100%;

        border-radius: 22px;

        padding: 20px;
    }

    .worker {
        width: 115px;
    }

    .tagline {
        margin-bottom: 22px;
    }

    h1 {
        font-size: 36px;
    }

    .message {
        margin-bottom: 20px;
    }

    .bottom {
        margin-top: 20px;
    }
}

/* Very small phones */
@media (max-height: 650px) {
    .worker {
        width: 80px;
        margin-bottom: 5px;
    }

    .tagline {
        margin-bottom: 12px;
    }

    h1 {
        font-size: 30px;
    }

    .message {
        margin-bottom: 15px;
    }

    .bottom {
        margin-top: 15px;
    }
}

/* Maintenance Image Display (Pure responsive photo adjusted to phone/laptop) */
.image-container {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    display: none;
    align-items: center;
    justify-content: center;
    background: #0a0d14;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 5;
    overflow: hidden;
}

.maintenance-picture {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.maintenance-photo {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
}

/* Smooth Whitening Effect Overlay */
.white-flash-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: #ffffff;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

.white-flash-overlay.active {
    opacity: 1;
}
</style>
</head>

<body>

<!-- Initial 3-Second Maintenance HTML Card -->
<div class="page" id="fallbackCard">
    <div class="card">
        <!-- Railsaathi Logo -->
        <img
            src="railsaathi-logo.png"
            class="worker"
            alt="Railsaathi Logo"
        >

        <div class="brand">
            Rail<span>saathi</span>
        </div>

        <div class="tagline">
            SAATH HAR KADAM
        </div>

        <div class="icon">
            🛠️
        </div>

        <h1>
            Under <span>Maintenance</span>
        </h1>

        <p class="message">
            We're making Railsaathi better.
        </p>

        <div class="progress-wrapper">
            <div class="progress">
                <div class="progress-bar"></div>
            </div>

            <div class="progress-text">
                WORK IN PROGRESS
            </div>
        </div>

        <div class="bottom">
            We'll be back soon. <span>🚧</span>
        </div>
    </div>
</div>

<!-- Maintenance Photo Container (maintenancesp.png for smartphone, maintenancelp.png for laptop) -->
<div class="image-container" id="imageContainer">
    <picture class="maintenance-picture">
        <!-- Smart phone version: portrait / small screens -->
        <source media="(max-width: 768px)" srcset="maintenancesp.png">
        <source media="(orientation: portrait) and (max-width: 1024px)" srcset="maintenancesp.png">
        <!-- Laptop / Desktop version -->
        <source media="(min-width: 769px)" srcset="maintenancelp.png">
        <img
            id="maintenanceImg"
            src="maintenancelp.png"
            class="maintenance-photo"
            alt="Railsaathi Under Maintenance"
        >
    </picture>
</div>

<!-- Whitening Transition Overlay -->
<div class="white-flash-overlay" id="whiteFlash"></div>

<script>
var imageLoaded = false;
var timerElapsed = false;
var transitioned = false;

function doWhiteningTransition() {
    if (transitioned) return;
    transitioned = true;

    var flash = document.getElementById('whiteFlash');
    var fallback = document.getElementById('fallbackCard');
    var container = document.getElementById('imageContainer');

    if (!flash) {
        if (fallback) fallback.style.display = 'none';
        if (container) container.style.display = 'flex';
        return;
    }

    // Step 1: Smoothly fade in white flash
    flash.classList.add('active');

    setTimeout(function() {
        // Step 2: Swap view behind the white flash
        if (fallback) fallback.style.display = 'none';
        if (container) container.style.display = 'flex';

        // Step 3: Smoothly fade out white flash to reveal maintenance photo
        requestAnimationFrame(function() {
            setTimeout(function() {
                flash.classList.remove('active');
            }, 60);
        });
    }, 500);
}

function checkAndTransition() {
    if (timerElapsed && imageLoaded) {
        doWhiteningTransition();
    }
}

// 1. Mark image as loaded
function onImageReady() {
    imageLoaded = true;
    checkAndTransition();
}

var img = document.getElementById('maintenanceImg');
if (img) {
    if (img.complete && img.naturalWidth > 0) {
        onImageReady();
    } else {
        img.addEventListener('load', onImageReady);
    }
}

// Preload both smartphone and laptop images
var pPhone = new Image();
pPhone.src = 'maintenancesp.png';
var pLaptop = new Image();
pLaptop.src = 'maintenancelp.png';

pPhone.onload = onImageReady;
pLaptop.onload = onImageReady;

// 2. 3-second timer
setTimeout(function() {
    timerElapsed = true;
    // If image is already ready or cached, transition immediately
    checkAndTransition();
    
    // Safety fallback: if image takes a few moments more on slow connection, trigger as soon as it arrives
    setTimeout(function() {
        if (!transitioned) {
            imageLoaded = true;
            doWhiteningTransition();
        }
    }, 4000);
}, 3000);
</script>

</body>
</html>
