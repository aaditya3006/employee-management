<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Janmashtami | Railsaathi</title>
  <link rel="icon" type="image/png" href="railsaathi-logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 0.6s ease;
    }

    body.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      border: 0;
      outline: 0;
      pointer-events: auto;
      user-select: none;
      background: #000;
    }

    /* Top bar for festive badge and skip */
    .top-controls {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      z-index: 100;
      pointer-events: none;
    }

    .festive-badge {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fef08a;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(250, 204, 21, 0.35);
      border-radius: 9999px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      transition: all 0.25s ease;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .enter-btn:hover {
      background: rgba(15, 23, 42, 0.95);
      border-color: rgba(250, 204, 21, 0.85);
      transform: scale(1.04);
      box-shadow: 0 6px 20px rgba(250, 204, 21, 0.25);
    }

    .sound-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 9px 20px;
      border-radius: 9999px;
      font-size: 12.5px;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: pulseHint 2.4s infinite;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .sound-hint.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @keyframes pulseHint {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.92; }
      50% { transform: translateX(-50%) scale(1.03); opacity: 1; }
    }

    @media (max-width: 640px) {
      .top-controls {
        padding: 12px 14px;
      }
      .festive-badge {
        font-size: 11.5px;
        padding: 6px 12px;
      }
      .enter-btn {
        padding: 6px 14px;
        font-size: 12px;
      }
      .sound-hint {
        font-size: 11.5px;
        padding: 8px 16px;
        bottom: 16px;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <div class="top-controls">
    <div class="festive-badge">
      <span>🪈</span>
      <span>Happy Janmashtami</span>
    </div>
    <div class="btn-group">
      <button id="enter-btn" class="enter-btn" type="button" aria-label="Enter Railsaathi Portal">
        Enter Portal →
      </button>
    </div>
  </div>

  <div id="sound-hint" class="sound-hint hidden" role="button" aria-label="Enable sound">
    <span>🔊</span> Tap anywhere for sound
  </div>

  <script>
    (function () {
      // Expiration check: active till 4th Sep 2026 end of day (IST: 2026-09-05 00:00:00)
      const expireTimestamp = new Date('2026-09-05T00:00:00+05:30').getTime();
      if (Date.now() >= expireTimestamp) {
        window.location.replace('/');
        return;
      }

      const enterBtn = document.getElementById('enter-btn');
      const soundHint = document.getElementById('sound-hint');
      let isRedirecting = false;

      function goToPortal() {
        if (isRedirecting) return;
        isRedirecting = true;
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.location.replace('/');
        }, 550);
      }

      const screen = document.createElement("video");
      screen.id = "screen";
      screen.src = "video.mp4";
      screen.autoplay = true;
      screen.loop = false; // Video completes naturally and transitions into the portal
      screen.muted = false;
      screen.playsInline = true;
      screen.controls = false;
      screen.setAttribute("controlsList", "nodownload noplaybackrate");
      screen.setAttribute("disablePictureInPicture", "");

      document.body.prepend(screen);

      // On video natural finish, smoothly transition to portal
      screen.addEventListener("ended", goToPortal);

      // Handle Skip / Enter Portal button
      if (enterBtn) {
        enterBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          goToPortal();
        });
      }

      // Autoplay handling with fallback to muted & tap-to-unmute
      const startPlayback = () => {
        screen.muted = false;
        screen.play().then(() => {
          if (soundHint) soundHint.classList.add('hidden');
        }).catch(() => {
          // Browser requires user gesture for unmuted autoplay
          screen.muted = true;
          screen.play().then(() => {
            if (soundHint) soundHint.classList.remove('hidden');

            const unmuteOnTap = () => {
              screen.muted = false;
              if (soundHint) soundHint.classList.add('hidden');
              window.removeEventListener("click", unmuteOnTap);
              window.removeEventListener("touchstart", unmuteOnTap);
            };

            window.addEventListener("click", unmuteOnTap, { once: true });
            window.addEventListener("touchstart", unmuteOnTap, { once: true, passive: true });
          }).catch(() => {});
        });
      };

      startPlayback();

      // Tap anywhere on video to unmute if still muted
      screen.addEventListener("click", () => {
        if (screen.muted) {
          screen.muted = false;
          if (soundHint) soundHint.classList.add('hidden');
        }
      });
    })();
  </script>
</body>
</html>
