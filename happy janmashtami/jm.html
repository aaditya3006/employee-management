<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Janmashtami</title>
  <link rel="icon" type="image/png" href="railsaathi-logo.png">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    #screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      border: 0;
      outline: 0;
      pointer-events: auto;
      user-select: none;
    }

    /* Subtle skip/portal button if user wants to enter website */
    .enter-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      padding: 8px 18px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      font-family: 'Poppins', sans-serif, system-ui;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .enter-btn:hover {
      background: rgba(15, 23, 42, 0.95);
      border-color: rgba(250, 204, 21, 0.8);
      transform: scale(1.04);
    }
  </style>
</head>
<body>
  <a href="/" class="enter-btn">Enter Portal →</a>

  <script>
    (function () {
      const expireTimestamp = new Date('2026-09-05T00:00:00+05:30').getTime();
      if (Date.now() >= expireTimestamp) {
        window.location.replace('/');
        return;
      }

      const screen = document.createElement("video");
      screen.id = "screen";
      screen.src = "video.mp4";
      screen.autoplay = true;
      screen.loop = true;
      screen.muted = false;
      screen.playsInline = true;
      screen.controls = false;
      screen.setAttribute("controlsList", "nodownload noplaybackrate");
      screen.setAttribute("disablePictureInPicture", "");

      document.body.prepend(screen);

      const start = () => {
        screen.muted = false;
        screen.play().catch(() => {
          // If browser requires muted first for autoplay
          screen.muted = true;
          screen.play().then(() => {
            const unmuteOnTap = () => {
              screen.muted = false;
              window.removeEventListener("click", unmuteOnTap);
              window.removeEventListener("touchstart", unmuteOnTap);
            };
            window.addEventListener("click", unmuteOnTap, { once: true });
            window.addEventListener("touchstart", unmuteOnTap, { once: true, passive: true });
          }).catch(() => {});
        });
      };

      start();
      window.addEventListener("click", start, { once: true });
      window.addEventListener("keydown", start, { once: true });
      window.addEventListener("touchstart", start, { once: true, passive: true });
    })();
  </script>
</body>
</html>
