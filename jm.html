<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Railsaathi</title>
  <link rel="icon" type="image/png" href="railsaathi-logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 0.6s ease;
    }

    body.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      border: 0;
      outline: 0;
      pointer-events: auto;
      user-select: none;
      background: #000;
      cursor: default;
    }

    /* Top bar for skip / enter button */
    .top-controls {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 16px 20px;
      z-index: 100;
      pointer-events: none;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      transition: all 0.25s ease;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .enter-btn:hover {
      background: rgba(15, 23, 42, 0.95);
      border-color: rgba(250, 204, 21, 0.85);
      transform: scale(1.04);
      box-shadow: 0 6px 20px rgba(250, 204, 21, 0.25);
    }

    @media (max-width: 640px) {
      .top-controls {
        padding: 12px 14px;
      }
      .enter-btn {
        padding: 6px 14px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="top-controls">
    <div class="btn-group">
      <button id="enter-btn" class="enter-btn" type="button" aria-label="Enter Railsaathi Portal">
        Enter Portal →
      </button>
    </div>
  </div>

  <script>
    (function () {
      // Expiration check: active till 4th Sep 2026 end of day (IST: 2026-09-05 00:00:00)
      const expireTimestamp = new Date('2026-09-05T00:00:00+05:30').getTime();
      if (Date.now() >= expireTimestamp) {
        window.location.replace('/');
        return;
      }

      const enterBtn = document.getElementById('enter-btn');
      let isRedirecting = false;

      function goToPortal() {
        if (isRedirecting) return;
        isRedirecting = true;
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.location.replace('/');
        }, 550);
      }

      const screen = document.createElement("video");
      screen.id = "screen";
      screen.src = "video.mp4";
      screen.autoplay = true;
      screen.loop = true;
      screen.muted = false;
      screen.volume = 1.0;
      screen.playsInline = true;
      screen.setAttribute("playsinline", "true");
      screen.setAttribute("webkit-playsinline", "true");
      screen.controls = false;
      screen.setAttribute("controlsList", "nodownload noplaybackrate");
      screen.setAttribute("disablePictureInPicture", "");

      document.body.prepend(screen);

      // Handle Skip / Enter Portal button
      if (enterBtn) {
        enterBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          goToPortal();
        });
      }

      function setVideoSpeed() {
        if (screen) {
          screen.playbackRate = 1.25;
          screen.defaultPlaybackRate = 1.25;
        }
      }

      function tryPlayWithSound() {
        if (!screen) return;
        screen.muted = false;
        screen.defaultMuted = false;
        screen.removeAttribute('muted');
        screen.volume = 1.0;
        setVideoSpeed();

        const playPromise = screen.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            setVideoSpeed();
            removeActivationListeners();
          }).catch(() => {
            // Autoplay with audio blocked by browser policy: play muted first,
            // and unmute immediately on any interaction anywhere on the screen
            screen.muted = true;
            screen.play().then(() => {
              setVideoSpeed();
            }).catch(() => {});
          });
        }
      }

      function unlockAudio() {
        if (!screen) return;
        screen.muted = false;
        screen.defaultMuted = false;
        screen.removeAttribute('muted');
        screen.volume = 1.0;
        setVideoSpeed();
        const playPromise = screen.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            setVideoSpeed();
            removeActivationListeners();
          }).catch(() => {});
        }
      }

      const activationEvents = [
        'touchstart', 'touchend', 'touchmove',
        'pointerdown', 'pointerup',
        'mousedown', 'mouseup', 'click',
        'keydown', 'scroll', 'wheel', 'focus', 'pageshow', 'visibilitychange'
      ];

      let listenersAttached = false;
      function attachActivationListeners() {
        if (listenersAttached) return;
        listenersAttached = true;
        activationEvents.forEach((evt) => {
          window.addEventListener(evt, unlockAudio, { capture: true, passive: true });
          document.addEventListener(evt, unlockAudio, { capture: true, passive: true });
        });
      }

      function removeActivationListeners() {
        if (!listenersAttached) return;
        listenersAttached = false;
        activationEvents.forEach((evt) => {
          window.removeEventListener(evt, unlockAudio, { capture: true });
          document.removeEventListener(evt, unlockAudio, { capture: true });
        });
      }

      attachActivationListeners();
      setVideoSpeed();
      tryPlayWithSound();

      screen.addEventListener('play', () => {
        setVideoSpeed();
        if (!screen.muted) {
          screen.volume = 1.0;
          removeActivationListeners();
        }
      });
      screen.addEventListener('loadedmetadata', () => {
        setVideoSpeed();
        if (screen.muted) {
          tryPlayWithSound();
        }
      });
      screen.addEventListener('ratechange', () => {
        if (screen.playbackRate !== 1.25) {
          screen.playbackRate = 1.25;
        }
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && screen.muted) {
          unlockAudio();
        }
      });
    })();
  </script>
</body>
</html>
