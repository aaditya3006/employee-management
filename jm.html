<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Railsaathi</title>
  <link rel="icon" type="image/png" href="railsaathi-logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: opacity 0.6s ease;
    }

    body.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
      border: 0;
      outline: 0;
      pointer-events: auto;
      user-select: none;
      background: #000;
      cursor: pointer;
    }

    /* Top bar for skip / enter button */
    .top-controls {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 16px 20px;
      z-index: 100;
      pointer-events: none;
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
      transition: all 0.25s ease;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .enter-btn:hover {
      background: rgba(15, 23, 42, 0.95);
      border-color: rgba(250, 204, 21, 0.85);
      transform: scale(1.04);
      box-shadow: 0 6px 20px rgba(250, 204, 21, 0.25);
    }

    .jm-bottom-greeting {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 100;
      pointer-events: none;
      padding: 0 20px;
      background: transparent !important;
    }

    .jm-greeting-text {
      display: inline-block;
      color: #ffffff;
      font-size: clamp(13px, 2.6vw, 17px);
      font-weight: 600;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95), 0 4px 16px rgba(0, 0, 0, 0.9), 0 0 24px rgba(0, 0, 0, 0.85);
      letter-spacing: 0.3px;
      line-height: 1.4;
      transition: opacity 0.4s ease, transform 0.4s ease;
      will-change: opacity, transform;
    }

    @media (max-width: 640px) {
      .top-controls {
        padding: 12px 14px;
      }
      .enter-btn {
        padding: 6px 14px;
        font-size: 12px;
      }
      .jm-bottom-greeting {
        bottom: 16px;
        padding: 0 12px;
      }
    }
  </style>
</head>
<body>
  <div class="top-controls">
    <div class="btn-group">
      <button id="enter-btn" class="enter-btn" type="button" aria-label="Enter Railsaathi Portal">
        Enter Portal →
      </button>
    </div>
  </div>

  <div class="jm-bottom-greeting" aria-live="polite">
    <span id="jm-greeting-text" class="jm-greeting-text">RailSaathi wishes you and your loved ones a very Happy Janmashtami! 🦚✨</span>
  </div>

  <script>
    (function () {
      // Expiration check: active till 4th Sep 2026 end of day (IST: 2026-09-05 00:00:00)
      const expireTimestamp = new Date('2026-09-05T00:00:00+05:30').getTime();
      if (Date.now() >= expireTimestamp) {
        window.location.replace('/');
        return;
      }

      const enterBtn = document.getElementById('enter-btn');
      let isRedirecting = false;

      function goToPortal() {
        if (isRedirecting) return;
        isRedirecting = true;
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.location.replace('/');
        }, 550);
      }

      const screen = document.createElement("video");
      screen.id = "screen";
      screen.src = "video.mp4";
      screen.autoplay = true;
      screen.loop = true; // Video plays continuously in loop
      screen.muted = true; // Initial muted ensures instant autoplay across all browsers
      screen.playsInline = true;
      screen.controls = false;
      screen.setAttribute("controlsList", "nodownload noplaybackrate");
      screen.setAttribute("disablePictureInPicture", "");

      document.body.prepend(screen);

      // Handle Skip / Enter Portal button
      if (enterBtn) {
        enterBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          goToPortal();
        });
      }

      function applyVideoSettings() {
        if (screen) {
          screen.playbackRate = 1.25;
          screen.defaultPlaybackRate = 1.25;
        }
      }

      function ensureSoundOn() {
        if (screen) {
          screen.muted = false;
          screen.volume = 1.0;
          applyVideoSettings();
          screen.play().catch(() => {});
        }
      }

      applyVideoSettings();
      screen.addEventListener('play', applyVideoSettings);
      screen.addEventListener('loadedmetadata', applyVideoSettings);
      screen.addEventListener('ratechange', () => {
        if (screen.playbackRate !== 1.25) {
          screen.playbackRate = 1.25;
        }
      });

      // Autoplay handling: start playback immediately & enable unmuted sound
      const startPlayback = () => {
        screen.play().catch(() => {});

        // Try unmuting directly
        screen.muted = false;
        screen.volume = 1.0;
        const playPromise = screen.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            ensureSoundOn();
          }).catch(() => {
            // Autoplay policy prevented unmuted play before gesture
            screen.muted = true;
            applyVideoSettings();
            screen.play().catch(() => {});

            const unmuteOnTap = () => {
              ensureSoundOn();
              ['click', 'touchstart', 'touchend', 'pointerdown', 'keydown', 'scroll', 'mousedown'].forEach((evt) => {
                window.removeEventListener(evt, unmuteOnTap, true);
                document.removeEventListener(evt, unmuteOnTap, true);
              });
            };

            ['click', 'touchstart', 'touchend', 'pointerdown', 'keydown', 'scroll', 'mousedown'].forEach((evt) => {
              window.addEventListener(evt, unmuteOnTap, { capture: true, passive: true });
              document.addEventListener(evt, unmuteOnTap, { capture: true, passive: true });
            });
          });
        }
      };

      startPlayback();

      // Ensure sound is enabled on click
      screen.addEventListener("click", ensureSoundOn);

      // Rotating festive greeting text (English <-> Hindi every 6 seconds)
      const greetingEl = document.getElementById('jm-greeting-text');
      if (greetingEl) {
        const messages = [
          "RailSaathi wishes you and your loved ones a very Happy Janmashtami! 🦚✨",
          "रेलसाथी की ओर से आपको एवं आपके प्रियजनों को जन्माष्टमी की हार्दिक शुभकामनाएँ! 🦚✨"
        ];
        let msgIndex = 0;
        setInterval(() => {
          greetingEl.style.opacity = '0';
          greetingEl.style.transform = 'translateY(3px)';
          setTimeout(() => {
            msgIndex = (msgIndex + 1) % messages.length;
            greetingEl.textContent = messages[msgIndex];
            greetingEl.style.opacity = '1';
            greetingEl.style.transform = 'translateY(0)';
          }, 400);
        }, 6000);
      }
    })();
  </script>
</body>
</html>
